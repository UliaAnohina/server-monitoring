services:
  db:
    image: postgres:13
    env_file:
      - ../monitoringSystemBackend/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../monitoringSystemBackend
    env_file:
      - ../monitoringSystemBackend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    pid: "host"
    privileged: true
    volumes:
      - /proc:/host/proc:ro

  frontend:
    build:
      context: .
    depends_on:
      - backend
    environment:
      VITE_USE_MOCKS: "false"
      VITE_API_BASE_URL: "/api"
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pg_data:
